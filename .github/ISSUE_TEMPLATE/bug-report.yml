name: 🐛 Bug Report
description: Report a problem with Mudra.
title: "[Bug]: "
labels:
  - "bug"

body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Tell us how to reproduce the issue.
    validations:
      required: true