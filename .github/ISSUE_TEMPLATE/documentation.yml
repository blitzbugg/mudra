name: 📚 Documentation
description: Improve or add Mudra documentation.
title: "[Docs]: "
labels:
  - "documentation"
  - "good first issue"

body:
  - type: textarea
    id: improvement
    attributes:
      label: What should be documented?
      description: Explain what is missing or unclear.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Explain what you would like to add or change.
    validations:
      required: true