name: Validate Assets

on:
  pull_request:
    branches: [main]
    paths:
      - "assets/**"
      - "docs/schemas/**"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "docs/schemas/**"
      - "scripts/**"

jobs:
  validate:
    name: Validate SVGs and Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate assets
        run: node scripts/validate-assets.mjs
