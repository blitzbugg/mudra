<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <defs>
    <pattern id="tiles" x="0" y="0" width="26" height="14" patternUnits="userSpaceOnUse">
      <rect width="26" height="14" fill="#B71C1C"/>
      <path d="M0 14 Q13 6 26 14" fill="#C0392B"/>
      <path d="M0 0 Q13 8 26 0" fill="#D32F2F" stroke="#8B1A1A" stroke-width="0.4"/>
    </pattern>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3E2723"/>
      <stop offset="50%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4A843"/>
      <stop offset="50%" stop-color="#C49B32"/>
      <stop offset="100%" stop-color="#A67C20"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCEEFB"/>
      <stop offset="100%" stop-color="#F0F6FC"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B9D77"/>
      <stop offset="100%" stop-color="#6B7D5A"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2C1A14"/>
      <stop offset="20%" stop-color="#4E342E"/>
      <stop offset="50%" stop-color="#5D4037"/>
      <stop offset="80%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#2C1A14"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#1a1a1a" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#1a1a1a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="820" fill="url(#sky)"/>

  <!-- Ground -->
  <g id="ground-layer">
    <rect x="0" y="660" width="1000" height="160" fill="url(#ground)"/>
    <rect x="0" y="660" width="1000" height="4" fill="#7A8C66" opacity="0.5"/>
    <line x1="50" y1="700" x2="150" y2="700" stroke="#7A8C66" stroke-width="0.5" opacity="0.3"/>
    <line x1="800" y1="720" x2="920" y2="720" stroke="#7A8C66" stroke-width="0.5" opacity="0.3"/>
    <line x1="30" y1="750" x2="120" y2="750" stroke="#7A8C66" stroke-width="0.5" opacity="0.3"/>
    <line x1="870" y1="690" x2="970" y2="690" stroke="#7A8C66" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- ==================== FOUNDATION ==================== -->
