      <rect x="457" y="384" width="43" height="206" fill="#3E2723" rx="1"/>
      <rect x="500" y="384" width="43" height="206" fill="#3E2723" rx="1"/>
      <rect x="461" y="388" width="35" height="60" rx="1" fill="#4E342E" stroke="#2C1A14" stroke-width="0.8"/>
      <rect x="461" y="456" width="35" height="50" rx="1" fill="#4E342E" stroke="#2C1A14" stroke-width="0.8"/>
      <rect x="461" y="514" width="35" height="72" rx="1" fill="#4E342E" stroke="#2C1A14" stroke-width="0.8"/>
      <rect x="504" y="388" width="35" height="60" rx="1" fill="#4E342E" stroke="#2C1A14" stroke-width="0.8"/>
