      <path d="M145 510 Q155 505 165 510 L165 525 Q155 520 145 525 Z" fill="#4E342E"/>
      <rect x="146" y="525" width="3" height="50" fill="#3E2723" rx="1"/>
      <rect x="161" y="525" width="3" height="50" fill="#3E2723" rx="1"/>
      <rect x="149" y="445" width="1.5" height="60" fill="#5D4037" rx="0.5"/>
      <rect x="153" y="445" width="1.5" height="60" fill="#5D4037" rx="0.5"/>
      <rect x="157" y="445" width="1.5" height="60" fill="#5D4037" rx="0.5"/>
