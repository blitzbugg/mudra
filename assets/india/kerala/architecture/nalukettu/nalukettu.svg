        <line x1="0" y1="-85" x2="60" y2="-55"/>
        <line x1="60" y1="-55" x2="60" y2="55"/>
        <line x1="60" y1="55" x2="0" y2="85"/>
        <line x1="0" y1="85" x2="-60" y2="55"/>
        <line x1="-60" y1="55" x2="-60" y2="-55"/>
        <line x1="0" y1="-85" x2="0" y2="85"/>
        <line x1="-60" y1="-15" x2="60" y2="-15"/>
        <line x1="-60" y1="25" x2="60" y2="25"/>
        <line x1="-30" y1="-70" x2="-30" y2="70"/>
        <line x1="30" y1="-70" x2="30" y2="70"/>
      </g>
      <circle cx="0" cy="0" r="12" fill="#5D7A4A" opacity="0.7"/>
      <circle cx="0" cy="0" r="7" fill="#6B8F50" opacity="0.8"/>
      <circle cx="0" cy="0" r="3" fill="#7DA85E"/>
      <rect x="-70" y="-65" width="140" height="130" fill="none" stroke="#5D4037" stroke-width="3" rx="2"/>
      <circle cx="-65" cy="-60" r="2.5" fill="url(#brass)"/>
      <circle cx="65" cy="-60" r="2.5" fill="url(#brass)"/>
      <circle cx="-65" cy="60" r="2.5" fill="url(#brass)"/>
      <circle cx="65" cy="60" r="2.5" fill="url(#brass)"/>
    </g>

