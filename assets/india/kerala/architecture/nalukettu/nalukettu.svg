    <rect x="120" y="590" width="760" height="6" fill="#E8E4DC" stroke="#D5D0C8" stroke-width="0.5"/>
    <rect x="120" y="648" width="760" height="12" rx="1" fill="#EDE9E1" stroke="#D5D0C8" stroke-width="0.5"/>
    <rect x="120" y="655" width="760" height="5" fill="#D5D0C8" opacity="0.5"/>
    <rect x="370" y="650" width="260" height="10" rx="1" fill="#F5F1EA" stroke="#D5D0C8" stroke-width="0.5"/>
    <rect x="390" y="640" width="220" height="10" rx="1" fill="#F5F1EA" stroke="#D5D0C8" stroke-width="0.5"/>
