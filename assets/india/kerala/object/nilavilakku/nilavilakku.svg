<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <defs>
    <!-- Brass Metallic Gradient -->
    <linearGradient id="brass-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C58B2B"/>
      <stop offset="25%" stop-color="#E9C26B"/>
      <stop offset="50%" stop-color="#FFF2B2"/>
      <stop offset="75%" stop-color="#E9C26B"/>
      <stop offset="100%" stop-color="#A26B15"/>
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="flame-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="60%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <g id="nilavilakku">
    <!-- Top Crown / Spire (Mottu) -->
    <path d="M 12,1.5 C 11.5,2.5 11.3,3.3 12,4.5 C 12.7,3.3 12.5,2.5 12,1.5 Z" fill="url(#brass-grad)"/>
    <ellipse cx="12" cy="4.8" rx="0.8" ry="0.4" fill="url(#brass-grad)"/>

    <!-- Oil Reservoir / Bowl (Thattu) -->
    <path d="M 8.5,6.5 C 8.5,8.8 15.5,8.8 15.5,6.5 L 17,5.5 C 17,8.5 7,8.5 7,5.5 Z" fill="url(#brass-grad)"/>
    <ellipse cx="12" cy="5.5" rx="5" ry="0.9" fill="#99600F"/>
    <ellipse cx="12" cy="5.5" rx="4.5" ry="0.7" fill="#603700"/>

    <!-- Flame (Thiri / Light) -->
    <path d="M 12,2.8 C 11.4,4.2 11.2,4.8 12,5.6 C 12.8,4.8 12.6,4.2 12,2.8 Z" fill="url(#flame-grad)"/>

    <!-- Upper Neck / Connector -->
    <path d="M 10.8,7.8 C 10.8,9 13.2,9 13.2,7.8 Z" fill="url(#brass-grad)"/>
    <ellipse cx="12" cy="8.6" rx="1.5" ry="0.3" fill="url(#brass-grad)"/>

    <!-- Central Pillar (Thandoo) -->
    <path d="M 11.2,8.8 
             C 10.8,11 10.5,12.5 11.3,14 
             C 10.5,15.5 10.8,17 11.2,19.2 
             L 12.8,19.2 
             C 13.2,17 13.5,15.5 12.7,14 
             C 13.5,12.5 13.2,11 12.8,8.8 Z" fill="url(#brass-grad)"/>

    <!-- Pillar Decorative Rings (Kumbam) -->
    <ellipse cx="12" cy="11.5" rx="1.6" ry="0.4" fill="url(#brass-grad)"/>
    <ellipse cx="12" cy="14.0" rx="2.0" ry="0.5" fill="url(#brass-grad)"/>
    <ellipse cx="12" cy="16.5" rx="1.6" ry="0.4" fill="url(#brass-grad)"/>

    <!-- Lower Base Ring -->
    <path d="M 9.5,19.2 L 14.5,19.2 L 15,20 L 9,20 Z" fill="url(#brass-grad)"/>

    <!-- Bottom Base (Peedam) -->
    <path d="M 9,20 C 7,20.8 5.5,21.5 5,22.5 L 19,22.5 C 18.5,21.5 17,20.8 15,20 Z" fill="url(#brass-grad)"/>
    <rect x="4.5" y="22.5" width="15" height="1" rx="0.3" fill="url(#brass-grad)"/>
  </g>
</svg>
