<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Mirror Head -->
  <!-- Outer gold frame ring -->
  <circle cx="12" cy="8" r="6" fill="none" stroke="#D97706" stroke-width="1.5"/>
  
  <!-- Inner reflective alloy -->
  <circle cx="12" cy="8" r="4.5" fill="#E2E8F0" stroke="#D97706" stroke-width="0.5"/>
  
  <!-- Mirror shine/reflection detail -->
  <circle cx="10.5" cy="6.5" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  
  <!-- Crown top motif - temple crest detail -->
  <circle cx="12" cy="1.5" r="0.75" fill="#D97706"/>
  
  <!-- Handle spine -->
  <rect x="11" y="13" width="2" height="8" fill="#D97706"/>
  
  <!-- Handle knob base -->
  <rect x="10" y="21" width="4" height="1.5" fill="#D97706" rx="0.5"/>
  
  <!-- Decorative handle accent line (optional traditional detail) -->
  <line x1="12" y1="13" x2="12" y2="21" stroke="#F59E0B" stroke-width="0.5" opacity="0.6"/>
</svg>
